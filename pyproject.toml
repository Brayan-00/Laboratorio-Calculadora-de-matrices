[project]
name = "matrix-calc"
version = "0.1.0"
description = "Calculadora de matrices — EL5859 Computación Heterogénea"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "numpy>=2.0"]

[project.scripts]
matrix-calc = "matrix_calc.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D203", "D213", "N802"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
